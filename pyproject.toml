[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-foraging-processing"
description = "Generated from aind-library-template"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.3.5"

dependencies = [
    "aind-behavior-dynamic-foraging[data] @ git+https://github.com/AllenNeuralDynamics/Aind.Behavior.DynamicForaging.git@v0.0.2rc37",
    "ipykernel",
]

[project.optional-dependencies]
qc = [
    "aind-data-schema>=2.4.1",
    "matplotlib",
]
nwb = [
    "aind-nwb-utils",
    "hdmf-zarr",
    "pynwb",
]
full = [
    "dynamic-foraging-processing[qc,nwb]",
]

[dependency-groups]
dev = [
    'ruff<0.16',
    'coverage',
    'interrogate',
    'pytest',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = 'py312'
extend-exclude = [
    '.conda',
    '.venv',
    'build',
    'dist',
]

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.coverage.run]
omit = ["*__init__*"]
source = ["dynamic_foraging_processing", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "if t\\.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "pragma: no cover"
]
fail_under = 100

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
