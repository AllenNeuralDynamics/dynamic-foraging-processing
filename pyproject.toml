[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-foraging-processing"
description = "Generated from aind-library-template"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.0.0"

dependencies = [
    "aind-behavior-dynamic-foraging[data] @ git+https://github.com/AllenNeuralDynamics/Aind.Behavior.DynamicForaging.git@8382bade6f16d3442e00efd02ee0d06b3b55f5ff",
    "ipykernel",
]

[dependency-groups]
dev = [
    'ruff',
    'coverage',
    'interrogate',
    'pytest',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = 'py311'
extend-exclude = [
    '.conda',
    '.venv',
    'build',
    'dist',
]

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.coverage.run]
omit = ["*__init__*", "*/temp_dataset.py"]
source = ["dynamic_foraging_processing", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "if t\\.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "pragma: no cover"
]
fail_under = 100

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
